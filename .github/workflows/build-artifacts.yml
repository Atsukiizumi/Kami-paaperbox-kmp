name: Build & Release Multiplatform Artifacts

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. 桌面端构建 (Windows & Linux 便携免安装版 Portable)
  build-desktop:
    name: Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 确保 gradlew 具备执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        shell: bash

      # 构建桌面便携版 (createDistributable)
      - name: Build Portable Desktop Package
        run: ./gradlew :composeApp:createDistributable --stacktrace
        shell: bash

      # Linux 便携包打包
      - name: Compress Linux Portable Bundle
        if: matrix.platform == 'linux'
        run: |
          cd composeApp/build/compose/binaries/main/app
          tar -czvf ../../../../../KamiPaperbox-Linux-x64-Portable.tar.gz *
        shell: bash

      # Windows 便携包打包
      - name: Compress Windows Portable Bundle
        if: matrix.platform == 'windows'
        run: |
          cd composeApp/build/compose/binaries/main/app
          Compress-Archive -Path * -DestinationPath ../../../../../KamiPaperbox-Windows-x64-Portable.zip
        shell: pwsh

      # 上传测试版 Artifacts (仅 Portable)
      - name: Upload Linux Portable Artifact
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: KamiPaperbox-Linux-x64-Portable
          path: KamiPaperbox-Linux-x64-Portable.tar.gz
          if-no-files-found: error

      - name: Upload Windows Portable Artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: KamiPaperbox-Windows-x64-Portable
          path: KamiPaperbox-Windows-x64-Portable.zip
          if-no-files-found: error

  # 2. Android APK 构建
  build-android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android APK
        run: ./gradlew :composeApp:assembleDebug --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KamiPaperbox-Android-Debug
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # 3. 自动发布与更新 Release
  publish-release:
    name: Update Release Assets
    needs: [build-desktop, build-android]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Collect Release Files
        run: |
          mkdir -p dist
          find release-artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.apk" \) -exec cp {} dist/ \;
          echo "Collected files for release:"
          ls -lh dist/

      # 分支推送：更新名为 "Github Action Auto CI" 的 Release
      - name: Publish CI Test Release (Github Action Auto CI)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "ci-test-build"
          name: "Github Action Auto CI"
          body: |
            ### 🚀 Github Action Auto CI (自动构建测试版)
            由 GitHub Actions 自动化流水线构建。
            包含桌面便携版（Windows / Linux 免安装解压即用）以及 Android 端 APK。

            - **Windows**: `KamiPaperbox-Windows-x64-Portable.zip`
            - **Linux**: `KamiPaperbox-Linux-x64-Portable.tar.gz`
            - **Android**: `KamiPaperbox-Android-Debug.apk`

            *构建触发 Commit: ${{ github.sha }}*
          files: dist/*
          prerelease: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Tag 推送：正式 Release
      - name: Publish Tagged Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          files: dist/*
          draft: false
          prerelease: contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc')
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
