name: Build & Release Multiplatform Artifacts

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. Android 端 APK 构建 (Debug & Release APK)
  build-android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Android APK
        run: |
          gradle :composeApp:assembleDebug --stacktrace

      - name: Prepare Android Artifacts
        run: |
          mkdir -p artifacts
          cp composeApp/build/outputs/apk/debug/*.apk artifacts/KamiPaperbox-Android-Universal-debug.apk
          ls -lh artifacts/

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: KamiPaperbox-Android-APK
          path: artifacts/*.apk
          if-no-files-found: error

  # 2. 桌面端多平台构建 (Windows: MSI 安装包 + Portable ZIP 便携版; Linux: DEB 安装包 + Portable TAR.GZ 便携版)
  build-desktop:
    name: Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      # Linux 环境下安装打包 .deb 与二进制剥离所需依赖
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot binutils

      # 构建原生安装包 (.msi / .deb) 以及便携版运行目录 (createDistributable)
      - name: Build Native Distribution and Distributable
        run: |
          gradle :composeApp:packageDistributionForCurrentOS :composeApp:createDistributable --stacktrace

      # 打包 Windows 产物：收集 .msi 安装包并打包 Portable .zip
      - name: Package Windows Artifacts (MSI & Portable ZIP)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          mkdir -p artifacts
          echo "Collecting Windows MSI installer..."
          find composeApp/build/compose/binaries/main -name "*.msi" -exec cp {} artifacts/ \; || true

          echo "Compressing Windows Portable ZIP..."
          if command -v 7z &> /dev/null; then
            7z a -tzip artifacts/KamiPaperbox-Windows-x64-Portable.zip ./composeApp/build/compose/binaries/main/app/KamiPaperbox
          else
            powershell -Command "Compress-Archive -Path 'composeApp/build/compose/binaries/main/app/KamiPaperbox' -DestinationPath 'artifacts/KamiPaperbox-Windows-x64-Portable.zip' -Force"
          fi

          echo "Artifacts ready:"
          ls -lh artifacts/

      # 打包 Linux 产物：收集 .deb 安装包并打包 Portable .tar.gz
      - name: Package Linux Artifacts (DEB & Portable TAR.GZ)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          mkdir -p artifacts
          echo "Collecting Linux DEB installer..."
          find composeApp/build/compose/binaries/main -name "*.deb" -exec cp {} artifacts/ \; || true

          echo "Compressing Linux Portable TAR.GZ..."
          tar -czvf artifacts/KamiPaperbox-Linux-x64-Portable.tar.gz -C composeApp/build/compose/binaries/main/app KamiPaperbox

          echo "Artifacts ready:"
          ls -lh artifacts/

      # 上传当前平台的桌面端构建产物
      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KamiPaperbox-${{ matrix.platform }}-Build
          path: artifacts/*
          if-no-files-found: error

  # 3. 自动发布与更新 Release 资产 (包含 APK + MSI + Portable ZIP + DEB + Portable TAR.GZ)
  publish-release:
    name: Publish Release Assets
    needs: [build-android, build-desktop]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Collect Release Files
        run: |
          mkdir -p dist
          find release-artifacts -type f \( -name "*.apk" -o -name "*.msi" -o -name "*.deb" -o -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} dist/ \;
          echo "Collected files for release:"
          ls -lh dist/

      # 分支推送：更新名为 "Github Action Auto CI" 的自动构建测试版 Release
      - name: Publish CI Test Release (Github Action Auto CI)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "ci-test-build"
          name: "Github Action Auto CI"
          body: |
            ### 🚀 Github Action Auto CI (自动构建测试版)
            由 GitHub Actions 自动化流水线构建。全平台构建产物列表：

            - **Android**:
              - 通用安装包: `KamiPaperbox-Android-Universal-debug.apk`
            - **Windows**:
              - 安装包: `*.msi`
              - 便携版 (解压即用): `KamiPaperbox-Windows-x64-Portable.zip`
            - **Linux**:
              - 安装包: `*.deb`
              - 便携版 (解压即用): `KamiPaperbox-Linux-x64-Portable.tar.gz`

            *构建触发 Commit: ${{ github.sha }}*
          files: dist/*
          prerelease: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Tag 推送：正式版本 Release
      - name: Publish Tagged Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          files: dist/*
          draft: false
          prerelease: contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc')
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
