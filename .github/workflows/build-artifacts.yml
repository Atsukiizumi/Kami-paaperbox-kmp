name: Build & Release Multiplatform Artifacts

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. Android 端 APK 构建 (产出独立 .apk，不压缩为 zip)
  build-android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Android APK
        run: |
          gradle :composeApp:assembleDebug --stacktrace

      - name: Prepare Android APK
        run: |
          mkdir -p artifacts
          cp composeApp/build/outputs/apk/debug/*.apk artifacts/KamiPaperbox-Android-Universal.apk
          ls -lh artifacts/

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: artifacts/KamiPaperbox-Android-Universal.apk
          if-no-files-found: error

  # 2. 桌面端构建 (Windows: 独立 MSI 安装包 + 便携版 ZIP; Linux: 独立 DEB 安装包 + 便携版 TAR.GZ)
  build-desktop:
    name: Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      # Linux 环境下安装打包工具
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot binutils

      # 构建原生安装包与便携运行目录
      - name: Build Native Distribution and Distributable
        run: |
          gradle :composeApp:packageDistributionForCurrentOS :composeApp:createDistributable --stacktrace

      # Windows 产物：MSI 保持独立原生文件，仅便携免安装目录打包为 ZIP
      - name: Package Windows Artifacts (MSI & Portable ZIP)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          mkdir -p artifacts
          echo "Collecting Windows MSI installer (独立安装文件)..."
          find composeApp/build/compose/binaries/main -name "*.msi" -exec cp {} artifacts/KamiPaperbox-Windows-Setup.msi \; || true

          echo "Compressing Portable Directory into ZIP (仅免安装便携版打包为 zip)..."
          powershell -Command "Compress-Archive -Path 'composeApp/build/compose/binaries/main/app/KamiPaperbox' -DestinationPath 'artifacts/KamiPaperbox-Windows-Portable.zip' -Force"

          echo "Windows Artifacts prepared:"
          ls -lh artifacts/

      # Linux 产物：DEB 保持独立原生包，仅便携免安装目录打包
      - name: Package Linux Artifacts (DEB & Portable TAR.GZ)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          mkdir -p artifacts
          echo "Collecting Linux DEB installer (独立安装包)..."
          find composeApp/build/compose/binaries/main -name "*.deb" -exec cp {} artifacts/KamiPaperbox-Linux-amd64.deb \; || true

          echo "Compressing Portable Directory into TAR.GZ (仅免安装便携版打包)..."
          tar -czvf artifacts/KamiPaperbox-Linux-Portable.tar.gz -C composeApp/build/compose/binaries/main/app KamiPaperbox

          echo "Linux Artifacts prepared:"
          ls -lh artifacts/

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Desktop-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error

  # 3. 自动发布与更新 Release (所有安装包均为独立原生文件，只有便携版是 zip)
  publish-release:
    name: Publish Release Assets
    needs: [build-android, build-desktop]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Collect Release Files
        run: |
          mkdir -p dist
          # 1. Android APK (直接作为 .apk 独立发布，不额外套 zip)
          find release-artifacts -type f -name "*.apk" -exec cp {} dist/KamiPaperbox-Android-Universal.apk \;
          # 2. Windows MSI (直接作为 .msi 独立安装包发布，不额外套 zip)
          find release-artifacts -type f -name "*.msi" -exec cp {} dist/KamiPaperbox-Windows-Setup.msi \;
          # 3. Linux DEB (直接作为 .deb 独立安装包发布，不额外套 zip)
          find release-artifacts -type f -name "*.deb" -exec cp {} dist/KamiPaperbox-Linux-amd64.deb \;
          # 4. Windows 免安装便携版 (只有便携版打包为 zip)
          find release-artifacts -type f -name "*Windows-Portable.zip" -exec cp {} dist/KamiPaperbox-Windows-Portable.zip \;
          # 5. Linux 免安装便携版
          find release-artifacts -type f -name "*Linux-Portable.tar.gz" -exec cp {} dist/KamiPaperbox-Linux-Portable.tar.gz \;
          echo "Collected release files:"
          ls -lh dist/

      # 分支推送：更新名为 "Github Action Auto CI" 的自动构建测试版 Release
      - name: Publish CI Test Release (Github Action Auto CI)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "ci-test-build"
          name: "Github Action Auto CI"
          body: |
            ### 🚀 Github Action Auto CI (自动构建测试版)
            由 GitHub Actions 自动化流水线构建。各平台构建产物均以独立原生文件提供下载：

            - 📱 **Android**:
              - `KamiPaperbox-Android-Universal.apk` (独立的 APK 原生安装文件，手机/平板直接安装)
            - 🪟 **Windows**:
              - `KamiPaperbox-Windows-Setup.msi` (原生的 MSI 安装引导程序)
              - `KamiPaperbox-Windows-Portable.zip` (绿色免安装便携版，解压即用)
            - 🐧 **Linux**:
              - `KamiPaperbox-Linux-amd64.deb` (原生的 DEB 系统安装包)
              - `KamiPaperbox-Linux-Portable.tar.gz` (绿色免安装便携版，解压即用)

            *构建触发 Commit: ${{ github.sha }}*
          files: dist/*
          prerelease: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Tag 推送：正式版本 Release
      - name: Publish Tagged Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          files: dist/*
          draft: false
          prerelease: contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc')
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
